giraffes:
  unit: black spots
  judge_kind: integer
  question: >-
    How many black spots are there in total on all giraffes currently alive in the world? Please consider all the relevant details (e.g. various species, spots per species etc.)
zills:
  unit: cymbal strikes
  judge_kind: integer
  question: >-
    What is the average number of cymbal strikes on zills a FCBD-style dancer produces during a single fast song? Please consider all the relevant details (e.g. tempo, song duration, striking patterns, rest periods etc.)
bridge:
  unit: tricks
  judge_kind: integer
  question: >-
    What is the total number of tricks played at contract bridge tournaments in Poland in 2025? Please consider all the relevant details (e.g. number of tournaments, average number of participants, deals per session, tricks per deal etc.)
crochet:
  unit: half-stitches (hdc)
  judge_kind: integer
  question: >-
    What is the total number of half-stitches (hdc) in all crochet shawls currently owned by German citizens? Please consider all the relevant details (e.g. number of crocheters in Germany, average shawls owned, stitches per shawl, proportion that are hdc etc.)
tbc:
  unit: right-foot steps
  judge_kind: integer
  question: >-
    What is the average number of right-foot steps onto the step performed by a participant in a single TBC class? Please consider all the relevant details (e.g. class duration, tempo, choreography patterns, rest intervals etc.)
maiden:
  unit: person-years
  judge_kind: integer
  question: >-
    What is the total combined age (in years) of all people who have attended an Iron Maiden concert on their own birthday, from the release of The Number of the Beast (1982) to today? Please consider all the relevant details (e.g. number of concerts and tours, average attendance, probability of attending on one's birthday, average age of attendees etc.)
turns:
  unit: significant left turns
  judge_kind: integer
  question: >-
    Estimate the total number of significant left turns on the shortest road route from Lisbon, Portugal to Singapore. Count as a "left turn": (1) actual left turns at intersections, and (2) any point where the road changes direction to the left by more than 45 degrees. Please consider all the relevant details (e.g. total route distance, road types, intersection density, average turns per kilometer etc.)
orangecars:
  unit: cars
  judge_kind: integer
  question: >-
    How many orange cars with the steering wheel on the right side AND at least 10 years old currently exist in the world? Please consider all the relevant details (e.g. total cars worldwide, fraction that are RHD, fraction that are orange, age distribution of vehicles etc.)
windowdays:
  unit: whole days
  judge_kind: duration_days
  question: >-
    How long (in days) did all humans together spend looking through a window in the whole year 1800? Please consider all the relevant details (e.g. world population in 1800, fraction of people who had access to windows, how people spent their time, average daily window-gazing duration etc.)

